services:
  webhook:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4455:3001"
    environment:
      - PORT=3001
      - DATA_DIR=/data
      # - HOOK_RATE_LIMIT_WINDOW_MS=60000  # optional (default: 60000)
      # - HOOK_RATE_LIMIT_MAX=60           # optional (default: 60)
      # - HOOK_IP_ALLOWLIST=1.2.3.4,5.6.7.8 # optional (exact match against req.ip)
      # Session/API rate limit (slows brute-force/enumeration of /api/sessions/*)
      # - API_RATE_LIMIT_WINDOW_MS=60000   # optional (default: 60000)
      # - API_RATE_LIMIT_MAX=300           # optional (default: 300)
    volumes:
      - hooklog-data:/data
    restart: unless-stopped

volumes:
  hooklog-data:
